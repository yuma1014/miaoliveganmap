<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蔬旅苗栗 | 探索山城純淨食光</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: "#F2F0EB",
                            card: "#FFFFFF",
                            primary: "#5E5045",
                            secondary: "#999999",
                            green: "#7C8C74",
                            greenDark: "#5C6B55",
                            accent: "#C4B2A3",
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { background-color: #F2F0EB; overflow: hidden; /* 防止手機版整體滾動 */ }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .map-filter { filter: grayscale(0.2) contrast(0.9) sepia(0.1); }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- 資料庫 (維持不變) ---
        const ALL_RESTAURANTS = [
            { id: 1, area: "miaoli", name: "禪廚蔬食餐廳", address: "苗栗縣苗栗市大坪頂52-6號", category: "創意合菜", rating: 4.5, hours: "11:00-14:00, 17:00-20:00", phone: "037-375252", tags: ["桌菜", "景觀", "停車場"], image: "https://www.chanchuvegetable.com/templates/cache/26190/images/575e0c529e844.jpg" },
            { id: 2, area: "miaoli", name: "佛光山大明寺滴水坊", address: "苗栗縣苗栗市經國路二段99號", category: "寺院素食", rating: 4.7, hours: "11:00-20:00 (週一休)", phone: "037-327305", tags: ["平價", "清靜", "簡餐"], image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Fo_Guang_Shan_Daming_Temple_20150927.jpg/800px-Fo_Guang_Shan_Daming_Temple_20150927.jpg" },
            { id: 3, area: "miaoli", name: "眾素之地", address: "苗栗縣苗栗市中正路88號", category: "異國料理", rating: 4.8, hours: "11:00-14:30", phone: "037-366888", tags: ["網美店", "義大利麵", "年輕化"], image: "https://images.unsplash.com/photo-1586546377313-2d2948645068?w=800&q=80" },
            { id: 4, area: "miaoli", name: "天慧素食", address: "苗栗縣苗栗市府前路120號", category: "傳統自助餐", rating: 4.2, hours: "10:30-19:30", phone: "037-333555", tags: ["秤重", "老字號"], image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&q=80" },
            { id: 11, area: "mountain", name: "卓也小屋", address: "苗栗縣三義鄉雙潭村13鄰崩山下1-5號", category: "景觀懷石", rating: 4.9, hours: "11:30-14:00, 17:30-19:20", phone: "037-879198", tags: ["藍染", "必去", "精緻"], image: "https://www.joye.com.tw/upload/room/b_20210204113038.jpg" },
            { id: 12, area: "mountain", name: "漫步雲端森林廚房", address: "苗栗縣三義鄉雙潭村崩山下22號", category: "蔬食套餐", rating: 4.4, hours: "11:00-18:00", phone: "037-879085", tags: ["城堡", "戶外草地", "親子"], image: "https://images.unsplash.com/photo-1518096283120-7216694e9242?w=800&q=80" },
            { id: 13, area: "mountain", name: "居鳩堂茶屋", address: "苗栗縣三義鄉水美48號", category: "客家蔬食", rating: 4.5, hours: "11:00-18:00", phone: "037-879879", tags: ["客家米食", "水晶餃", "庭園"], image: "https://images.unsplash.com/photo-1626805128723-d34ba0577732?w=800&q=80" },
            { id: 21, area: "coast", name: "五ooki 蔬食", address: "苗栗縣竹南鎮龍山路一段", category: "日式定食", rating: 4.6, hours: "11:30-20:00", phone: "037-460000", tags: ["日系", "炸豬排(素)", "質感"], image: "https://images.unsplash.com/photo-1582450871972-ab5ca641643d?w=800&q=80" },
            { id: 22, area: "coast", name: "養心餐飲", address: "苗栗縣頭份市東民一街", category: "創意料理", rating: 4.3, hours: "11:00-21:00", phone: "037-666666", tags: ["聚餐", "多樣化"], image: "https://images.unsplash.com/photo-1549488352-ee4b799988a0?w=800&q=80" },
            { id: 23, area: "coast", name: "一凡麵線", address: "苗栗縣竹南鎮博愛街", category: "小吃", rating: 4.7, hours: "06:00-13:00", phone: "0912-345678", tags: ["麵線", "臭豆腐", "排隊"], image: "https://images.unsplash.com/photo-1596561172827-0c3093950b92?w=800&q=80" }
        ];

        // --- SVG Icons ---
        const Icons = {
            MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Navigation: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>,
            Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            Back: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        const MapSection = ({ selectedRestaurant }) => {
            const query = encodeURIComponent(selectedRestaurant ? selectedRestaurant.name + " " + selectedRestaurant.address : "苗栗火車站");
            const mapSrc = `https://maps.google.com/maps?q=${query}&t=m&z=15&ie=UTF8&iwloc=&output=embed`;

            return (
                <div className="w-full h-full relative bg-gray-200 group">
                    <iframe title="map" width="100%" height="100%" frameBorder="0" scrolling="no" src={mapSrc}
                        className="w-full h-full relative z-10 map-filter opacity-90 transition-all duration-700 group-hover:opacity-100 group-hover:grayscale-0">
                    </iframe>
                    <div className="absolute inset-0 bg-morandi-green mix-blend-multiply opacity-10 pointer-events-none z-20"></div>
                </div>
            );
        };

        const App = () => {
            const [selectedId, setSelectedId] = useState(null);
            const [filterArea, setFilterArea] = useState("all"); 
            
            // 判斷是否為手機尺寸 (用於邏輯控制)
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const filteredRestaurants = useMemo(() => {
                if (filterArea === "all") return ALL_RESTAURANTS;
                return ALL_RESTAURANTS.filter(r => r.area === filterArea);
            }, [filterArea]);

            const selectedRestaurant = ALL_RESTAURANTS.find(r => r.id === selectedId);

            const FilterTab = ({ label, value }) => (
                <button 
                    onClick={() => { setFilterArea(value); setSelectedId(null); }}
                    className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider transition-all duration-300 shrink-0
                        ${filterArea === value 
                            ? 'bg-morandi-green text-white shadow-md shadow-morandi-green/20' 
                            : 'bg-white text-morandi-primary hover:bg-gray-100'}`}
                >
                    {label}
                </button>
            );

            return (
                <div className="flex flex-col md:flex-row h-screen w-full relative">
                    
                    {/* --- 左側列表區 (Desktop: 42%, Mobile: 100%) --- */}
                    <div className="w-full md:w-[42%] h-full flex flex-col relative z-20 shadow-[4px_0_24px_rgba(0,0,0,0.05)] bg-morandi-bg">
                        
                        {/* Header */}
                        <header className="px-6 py-5 bg-morandi-bg/95 backdrop-blur z-30 border-b border-gray-200/50">
                            <motion.div 
                                initial={{opacity:0, y:-10}}
                                animate={{opacity:1, y:0}}
                                className="flex items-center gap-3 mb-4"
                            >
                                <div className="w-1.5 h-10 bg-morandi-green rounded-full"></div>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-[0.15em] text-morandi-primary font-serif">蔬旅苗栗</h1>
                                    <p className="text-[10px] tracking-[0.3em] text-morandi-secondary uppercase mt-0.5">MIAOLI VEG TRAVEL</p>
                                </div>
                            </motion.div>
                            
                            {/* Scrollable Filter Tabs */}
                            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                <FilterTab label="所有地區" value="all" />
                                <FilterTab label="苗栗市" value="miaoli" />
                                <FilterTab label="山城慢遊" value="mountain" />
                                <FilterTab label="海線風情" value="coast" />
                            </div>
                        </header>

                        {/* List Content */}
                        <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-24 md:pb-4">
                            <AnimatePresence mode='wait'>
                                <motion.div 
                                    key={filterArea}
                                    initial={{ opacity: 0, y: 10 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -10 }}
                                    className="space-y-4"
                                >
                                    {filteredRestaurants.map((item) => (
                                        <motion.div
                                            key={item.id}
                                            layoutId={`card-${item.id}`} // 用於列表與詳情轉換的平滑過渡
                                            onClick={() => setSelectedId(item.id)}
                                            className={`
                                                group relative overflow-hidden rounded-[1.2rem] p-3 cursor-pointer transition-all duration-300 border
                                                ${selectedId === item.id 
                                                    ? 'bg-white border-morandi-green shadow-lg scale-[1.02]' 
                                                    : 'bg-white border-transparent hover:border-morandi-green/30 hover:shadow-md'}
                                            `}
                                        >
                                            <div className="flex gap-4">
                                                <div className="w-24 h-24 rounded-lg overflow-hidden shrink-0 relative bg-gray-100">
                                                    <img 
                                                        src={item.image} 
                                                        alt={item.name} 
                                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                                                        onError={(e) => {e.target.src='https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800&q=80'}}
                                                    />
                                                </div>
                                                <div className="flex-1 flex flex-col justify-center min-w-0">
                                                    <div className="flex justify-between items-start">
                                                        <h3 className="text-base font-bold text-morandi-primary truncate pr-2 font-serif">{item.name}</h3>
                                                        <div className="flex items-center gap-1 bg-yellow-50 px-1.5 py-0.5 rounded text-[10px] text-yellow-700 font-bold shrink-0">
                                                            <Icons.Star /> {item.rating}
                                                        </div>
                                                    </div>
                                                    <p className="text-xs text-morandi-secondary mt-0.5">{item.category}</p>
                                                    <p className="text-xs text-gray-400 mt-0.5 truncate">{item.address}</p>
                                                    <div className="mt-2 flex flex-wrap gap-1">
                                                        {item.tags.map(tag => (
                                                            <span key={tag} className="text-[10px] px-1.5 py-0.5 rounded bg-morandi-bg text-morandi-primary/70">#{tag}</span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </motion.div>
                                    ))}
                                </motion.div>
                            </AnimatePresence>
                            <div className="py-8 text-center opacity-40 text-[10px] tracking-widest text-morandi-secondary uppercase">
                                <p className="text-xs text-morandi-secondary/50 font-serif italic">©2025 蔬旅苗栗 版權所有</p>
                                <p className="text-xs text-morandi-secondary/50 font-serif italic">Designed by Shu Lu Miaoli from National United University (ROC)</p>
                                <p className="text-xs text-morandi-secondary/50 font-serif italic">電話：+886-908-822-009(Phone) 地址：國立聯合大學八甲校區</p>
                            </div>
                        </div>
                    </div>

                    {/* --- 右側地圖區 (Desktop: 58%, Mobile: Full Screen Overlay) --- */}
                    {/* 關鍵修改：
                       1. md:block md:static md:w-[58%] -> 保持電腦版原有樣式
                       2. fixed inset-0 z-50 -> 手機版變成全螢幕覆蓋
                       3. 使用 transform 進行手機版的滑入滑出控制
                    */}
                    <div className={`
                        bg-gray-100 transition-transform duration-300 ease-in-out
                        md:block md:w-[58%] md:static md:transform-none
                        fixed inset-0 z-50 
                        ${selectedId ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}
                    `}>
                        {/* 手機版：頂部返回按鈕 (電腦版隱藏) */}
                        <div className="absolute top-4 left-4 z-40 md:hidden">
                            <button 
                                onClick={(e) => { e.stopPropagation(); setSelectedId(null); }}
                                className="bg-white/90 backdrop-blur text-morandi-primary p-3 rounded-full shadow-lg border border-gray-200 flex items-center gap-2 active:scale-95 transition-transform"
                            >
                                <Icons.Back />
                                <span className="text-sm font-bold">返回列表</span>
                            </button>
                        </div>

                        <MapSection selectedRestaurant={selectedRestaurant} />
                        
                        {/* 餐廳詳細資訊卡片 */}
                        <AnimatePresence>
                            {selectedRestaurant && (
                                <motion.div 
                                    key="detail-card"
                                    initial={{ opacity: 0, y: 100 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: 100 }}
                                    transition={{ duration: 0.4, type: "spring", damping: 20 }}
                                    className="absolute bottom-0 left-0 right-0 md:bottom-8 md:left-8 md:right-8 bg-white/95 backdrop-blur-xl p-6 md:rounded-[1.5rem] rounded-t-[1.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] border-t border-white/50 z-30"
                                >
                                   {/* 手機版：上方的小把手指示器 */}
                                   <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4 md:hidden"></div>

                                   <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                                     <div>
                                       <h2 className="text-2xl font-bold text-morandi-primary font-serif mb-1">{selectedRestaurant.name}</h2>
                                       <div className="flex items-center gap-2 text-morandi-secondary text-sm">
                                         <div className="w-4 h-4 text-morandi-green"><Icons.MapPin /></div>
                                         <span className="tracking-wide text-xs md:text-sm">{selectedRestaurant.address}</span>
                                       </div>
                                       <div className="mt-2 text-xs text-morandi-greenDark font-medium bg-morandi-bg inline-block px-2 py-1 rounded">
                                          {selectedRestaurant.hours}
                                       </div>
                                     </div>
                                     
                                     <div className="flex gap-3 shrink-0">
                                        <a 
                                          href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(selectedRestaurant.name)}`} 
                                          target="_blank" 
                                          className="flex-1 md:flex-none flex justify-center items-center gap-2 bg-morandi-green text-white px-6 py-3 rounded-xl hover:bg-morandi-greenDark transition-all active:scale-95 shadow-lg shadow-morandi-green/20"
                                        >
                                          <Icons.Navigation />
                                          <span className="font-bold">導航</span>
                                        </a>
                                        <a 
                                          href={`tel:${selectedRestaurant.phone}`}
                                          className="flex-1 md:flex-none flex justify-center items-center gap-2 bg-white text-morandi-primary border border-gray-200 px-5 py-3 rounded-xl hover:bg-gray-50 active:bg-gray-100 transition-colors"
                                        >
                                          <Icons.Phone />
                                          <span className="md:hidden font-bold">通話</span>
                                       </a>
                                     </div>
                                   </div>
                                   {/* 手機版底部安全區留白 */}
                                   <div className="h-4 md:hidden"></div> 
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
